allowBuilds:
  edgedriver: true
  esbuild: true
  geckodriver: true
  msw: true
  protobufjs: true
  snyk: true

overrides:
  'deepmerge-ts@^7': '^8.0.0'
  'esbuild@^0.27': '^0.28.1'
  'protobufjs@^7': '^7.6.5'
  'shell-quote@^1': '^1.8.5'
  'uuid@^9': '^11.1.1'
  'ws@^8': '^8.21.0'

minimumReleaseAge: 4320 # 3 days
minimumReleaseAgeExclude:
  - '@ckeditor/*'
  - '@cksource/*'
  - '*ckeditor5*'

shellEmulator: true
shamefullyHoist: true
preferFrozenLockfile: true
verifyDepsBeforeRun: false
