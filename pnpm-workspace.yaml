onlyBuiltDependencies:
  - edgedriver
  - esbuild
  - geckodriver
  - msw
  - protobufjs
allowBuilds:
  edgedriver: true
  esbuild: true
  geckodriver: true
  protobufjs: true
  snyk: false

overrides:
  'diff@^7': '^8.0.3'
  'serialize-javascript@^6': '^7.0.5'
  'ws@^8': '^8.20.1'
  'shell-quote@^1': '^1.8.4'
  'uuid@^9': '^11.1.1'

minimumReleaseAge: 4320 # 3 days
minimumReleaseAgeExclude:
  - '@ckeditor/*'
  - '@cksource/*'
  - '*ckeditor5*'

shellEmulator: true
shamefullyHoist: true
preferFrozenLockfile: true
